<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-evidence-architecture-title run-evidence-architecture-desc">
  <title id="run-evidence-architecture-title">theHarvester discovery and evidence architecture</title>
  <desc id="run-evidence-architecture-desc">An authorized finite run selects passive, DNS, or direct activity, records each producer outcome, normalizes results with provenance, and exposes the same evidence through operator, automation, portable, and compatibility outputs.</desc>
  <defs>
    <style>
      .title { font: 600 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .step { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; fill: #5f6368; }
      .step-accent { fill: #e94c52; }
      .node-title { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .body { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .body-strong { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .technical { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5f6368; }
      .technical-accent { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e94c52; }
      .callout { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    </style>
    <marker id="run-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5f6368"/>
    </marker>
    <marker id="run-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94c52"/>
    </marker>
    <marker id="run-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#415f78"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f7f7f5"/>

  <text class="step" x="48" y="48">THEHARVESTER RUN</text>
  <text class="title" x="48" y="84">One finite run becomes attributable evidence</text>
  <text class="subtitle" x="48" y="112">Selection controls activity. Producer outcomes survive normalization and export.</text>

  <!-- Connectors are drawn before nodes so their endpoints remain clean. -->
  <line x1="256" y1="296" x2="296" y2="296" stroke="#5f6368" stroke-width="1.2" marker-end="url(#run-arrow)"/>
  <line x1="568" y1="296" x2="616" y2="296" stroke="#5f6368" stroke-width="1.2" marker-end="url(#run-arrow)"/>
  <line x1="864" y1="296" x2="912" y2="296" stroke="#5f6368" stroke-width="1.2" marker-end="url(#run-arrow)"/>
  <line x1="1072" y1="424" x2="1072" y2="504" stroke="#e94c52" stroke-width="1.2" marker-end="url(#run-arrow-accent)"/>

  <!-- 01 · authorized request -->
  <rect x="48" y="168" width="208" height="256" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="48" y1="168" x2="48" y2="424" stroke="#202124" stroke-width="4"/>
  <text class="step" x="72" y="200">01 · SCOPE</text>
  <text class="node-title" x="72" y="240">Define the run</text>
  <text class="body" x="72" y="280">One authorized target</text>
  <text class="body" x="72" y="312">Selected sources</text>
  <text class="body" x="72" y="344">Explicit actions</text>
  <line x1="72" y1="372" x2="232" y2="372" stroke="#dfe0e2" stroke-width="1"/>
  <text class="technical" x="72" y="400">FINITE · BOUNDED</text>

  <!-- 02 · activity boundary -->
  <rect x="296" y="144" width="272" height="304" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="296" y1="144" x2="296" y2="448" stroke="#202124" stroke-width="4"/>
  <text class="step" x="320" y="176">02 · ACTIVITY</text>
  <text class="node-title" x="320" y="216">Choose the boundary</text>
  <text class="technical" x="320" y="260">P0</text>
  <text class="body-strong" x="364" y="260">Passive collection</text>
  <text class="body" x="364" y="284">public providers / datasets</text>
  <line x1="320" y1="304" x2="544" y2="304" stroke="#dfe0e2" stroke-width="1"/>
  <text class="technical" x="320" y="336">P1</text>
  <text class="body-strong" x="364" y="336">DNS interaction</text>
  <text class="body" x="364" y="360">authorized names / addresses</text>
  <line x1="320" y1="380" x2="544" y2="380" stroke="#dfe0e2" stroke-width="1"/>
  <text class="technical-accent" x="320" y="412">P2</text>
  <text class="body-strong" x="364" y="412">Direct interaction</text>
  <text class="body" x="364" y="436">selected target endpoints</text>

  <!-- 03 · execution and producer outcomes -->
  <rect x="616" y="168" width="248" height="256" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="616" y1="168" x2="616" y2="424" stroke="#202124" stroke-width="4"/>
  <text class="step" x="640" y="200">03 · EXECUTE</text>
  <text class="node-title" x="640" y="240">Run and record outcomes</text>
  <text class="body" x="640" y="280">Collect observations</text>
  <text class="body" x="640" y="312">Keep results so far</text>
  <text class="body" x="640" y="344">Record producer outcomes</text>
  <line x1="640" y1="372" x2="840" y2="372" stroke="#dfe0e2" stroke-width="1"/>
  <text class="technical" x="640" y="400">COMPLETED · PARTIAL · FAILED</text>
  <text class="technical" x="640" y="420">RATE-LIMITED · SKIPPED</text>

  <!-- 04 · normalized evidence -->
  <rect x="912" y="168" width="320" height="256" rx="8" fill="#fff0f1" stroke="#e94c52" stroke-width="1.2"/>
  <line x1="912" y1="168" x2="912" y2="424" stroke="#e94c52" stroke-width="4"/>
  <text class="step step-accent" x="936" y="200">04 · EVIDENCE</text>
  <text class="node-title" x="936" y="240">Normalize once</text>
  <text class="body" x="936" y="280">Canonical kind + value</text>
  <text class="body" x="936" y="312">Provenance survives deduplication</text>
  <text class="body" x="936" y="344">Producer outcomes stay attached</text>
  <line x1="936" y1="372" x2="1208" y2="372" stroke="#efc7c9" stroke-width="1"/>
  <text class="technical-accent" x="936" y="400">COMPLETE · PARTIAL · FAILED</text>

  <!-- Editorial point -->
  <line x1="48" y1="520" x2="48" y2="596" stroke="#e94c52" stroke-width="4"/>
  <text class="step step-accent" x="72" y="536">PARTIAL RESULTS</text>
  <text class="callout" x="72" y="572">theHarvester keeps results when</text>
  <text class="callout" x="72" y="596">one producer stops early.</text>

  <!-- Output surfaces -->
  <rect x="616" y="504" width="616" height="144" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <text class="step" x="640" y="532">USE THE SAME EVIDENCE</text>
  <line x1="784" y1="548" x2="784" y2="628" stroke="#dfe0e2" stroke-width="1"/>
  <line x1="936" y1="548" x2="936" y2="628" stroke="#dfe0e2" stroke-width="1"/>
  <line x1="1088" y1="548" x2="1088" y2="628" stroke="#dfe0e2" stroke-width="1"/>
  <text class="body-strong" x="640" y="572">Review</text>
  <text class="technical" x="640" y="600">TERMINAL</text>
  <text class="technical" x="640" y="620">HARVESTVIEW</text>
  <text class="body-strong" x="808" y="572">Automate</text>
  <text class="technical" x="808" y="600">REST · JSONL</text>
  <text class="body-strong" x="960" y="572">Retain</text>
  <text class="technical" x="960" y="600">SQLITE</text>
  <text class="body-strong" x="1112" y="572">Integrate</text>
  <text class="technical" x="1112" y="600">JSON · XML</text>
</svg>
