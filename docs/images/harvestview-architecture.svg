<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harvestview-architecture-title harvestview-architecture-desc">
  <title id="harvestview-architecture-title">HarvestView local run architecture</title>
  <desc id="harvestview-architecture-desc">Inside one local-machine boundary, HarvestView submits and inspects runs through an authenticated loopback API, durable run control feeds one isolated worker, completed evidence stays separate from lifecycle state, and JSONL or SQLite moves that evidence without replaying activity.</desc>
  <defs>
    <style>
      .title { font: 600 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .zone { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; fill: #5f6368; }
      .tag { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #5f6368; }
      .tag-accent { fill: #e94c52; }
      .node-title { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .body { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .body-strong { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .technical { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5f6368; }
      .edge-label { font: 700 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #5f6368; }
      .edge-label-link { fill: #415f78; }
    </style>
    <marker id="view-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5f6368"/>
    </marker>
    <marker id="view-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94c52"/>
    </marker>
    <marker id="view-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#415f78"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f7f7f5"/>
  <text class="zone" x="48" y="48">HARVESTVIEW</text>
  <text class="title" x="48" y="84">HarvestView uses the same finite-run engine as the CLI</text>
  <text class="subtitle" x="48" y="112">Run control tracks work. Completed evidence stays separate and portable.</text>

  <!-- Local-machine boundary. -->
  <rect x="48" y="136" width="1184" height="536" rx="8" fill="#fafafa" stroke="#aeb1b5" stroke-width="1" stroke-dasharray="8,8"/>
  <rect x="68" y="128" width="252" height="20" fill="#f7f7f5"/>
  <text class="zone" x="76" y="144">LOCAL MACHINE · 127.0.0.1:5000</text>

  <!-- Connectors are drawn before nodes. -->
  <line x1="304" y1="228" x2="360" y2="228" stroke="#5f6368" stroke-width="1.2" marker-end="url(#view-arrow)"/>
  <line x1="360" y1="280" x2="304" y2="280" stroke="#415f78" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#view-arrow-link)"/>
  <line x1="580" y1="228" x2="636" y2="228" stroke="#5f6368" stroke-width="1.2" marker-end="url(#view-arrow)"/>
  <line x1="868" y1="228" x2="924" y2="228" stroke="#5f6368" stroke-width="1.2" marker-end="url(#view-arrow)"/>
  <line x1="416" y1="404" x2="416" y2="324" stroke="#415f78" stroke-width="1" marker-end="url(#view-arrow-link)"/>
  <path d="M1004 324 V584 Q1004 592 996 592 H532 Q524 592 524 584 V564" fill="none" stroke="#e94c52" stroke-width="1.2" marker-end="url(#view-arrow-accent)"/>
  <line x1="580" y1="460" x2="636" y2="460" stroke="#415f78" stroke-width="1.2" marker-end="url(#view-arrow-link)"/>

  <!-- Connector labels sit in open corridors with opaque masks. -->
  <rect x="308" y="200" width="48" height="12" rx="4" fill="#fafafa"/>
  <text class="edge-label" x="332" y="208" text-anchor="middle">SUBMIT</text>
  <rect x="312" y="252" width="40" height="12" rx="4" fill="#fafafa"/>
  <text class="edge-label edge-label-link" x="332" y="260" text-anchor="middle">VIEW</text>
  <rect x="584" y="200" width="48" height="12" rx="4" fill="#fafafa"/>
  <text class="edge-label" x="608" y="208" text-anchor="middle">QUEUE</text>
  <rect x="872" y="200" width="48" height="12" rx="4" fill="#fafafa"/>
  <text class="edge-label" x="896" y="208" text-anchor="middle">CLAIM</text>
  <rect x="428" y="352" width="40" height="20" rx="4" fill="#fafafa"/>
  <text class="edge-label edge-label-link" x="448" y="364" text-anchor="middle">READ</text>
  <rect x="584" y="432" width="48" height="12" rx="4" fill="#fafafa"/>
  <text class="edge-label edge-label-link" x="608" y="440" text-anchor="middle">EXPORT</text>
  <rect x="744" y="568" width="48" height="12" rx="4" fill="#fafafa"/>
  <text class="edge-label" x="768" y="576" text-anchor="middle">WRITE</text>

  <!-- HarvestView browser -->
  <rect x="88" y="180" width="216" height="144" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="88" y1="180" x2="88" y2="324" stroke="#202124" stroke-width="4"/>
  <text class="tag" x="112" y="208">BROWSER</text>
  <text class="node-title" x="112" y="244">Plan and inspect</text>
  <text class="body" x="112" y="276">target · sources</text>
  <text class="body" x="112" y="304">actions · history · inspect</text>

  <!-- Authenticated loopback API -->
  <rect x="360" y="180" width="220" height="144" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="360" y1="180" x2="360" y2="324" stroke="#202124" stroke-width="4"/>
  <text class="tag" x="384" y="208">API GATE</text>
  <text class="node-title" x="384" y="244">Authenticated API</text>
  <text class="body" x="384" y="276">HttpOnly browser session</text>
  <text class="technical" x="384" y="304">X-API-KEY FOR CLIENTS</text>

  <!-- Run control -->
  <rect x="636" y="156" width="232" height="192" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="636" y1="156" x2="636" y2="348" stroke="#202124" stroke-width="4"/>
  <text class="tag" x="660" y="184">CONTROL</text>
  <text class="node-title" x="660" y="220">Durable run control</text>
  <text class="body" x="660" y="252">queue · cancel · deadlines</text>
  <text class="body" x="660" y="280">worker lease · recovery</text>
  <line x1="660" y1="300" x2="844" y2="300" stroke="#dfe0e2" stroke-width="1"/>
  <text class="technical" x="660" y="324">QUEUED · RUNNING · TERMINAL</text>
  <text class="technical" x="660" y="344">SCHEDULES → FINITE RUNS</text>

  <!-- Isolated worker -->
  <rect x="924" y="180" width="236" height="144" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="924" y1="180" x2="924" y2="324" stroke="#202124" stroke-width="4"/>
  <text class="tag" x="948" y="208">WORKER</text>
  <text class="node-title" x="948" y="244">Isolated run worker</text>
  <text class="body" x="948" y="276">one finite run at a time</text>
  <text class="body" x="948" y="304">same core as the CLI</text>

  <!-- Completed evidence -->
  <rect x="360" y="404" width="220" height="160" rx="8" fill="#fff0f1" stroke="#e94c52" stroke-width="1.2"/>
  <line x1="360" y1="404" x2="360" y2="564" stroke="#e94c52" stroke-width="4"/>
  <text class="tag tag-accent" x="384" y="432">EVIDENCE</text>
  <text class="node-title" x="384" y="468">Run evidence</text>
  <text class="body" x="384" y="500">results · provenance</text>
  <text class="body" x="384" y="528">outcomes · status</text>

  <!-- Portable interchange -->
  <rect x="636" y="404" width="232" height="160" rx="8" fill="#ffffff" stroke="#c8cacd" stroke-width="1"/>
  <line x1="636" y1="404" x2="636" y2="564" stroke="#415f78" stroke-width="4"/>
  <text class="tag" x="660" y="432">INTERCHANGE</text>
  <text class="node-title" x="660" y="468">Portable evidence</text>
  <text class="body" x="660" y="500">JSONL · one run</text>
  <text class="body" x="660" y="528">SQLite · completed set</text>
  <text class="technical" x="660" y="552">SCREENSHOT FILES SEPARATE</text>

  <line x1="88" y1="620" x2="1192" y2="620" stroke="#dfe0e2" stroke-width="1"/>
  <text class="body-strong" x="88" y="648">Portable exports omit control state and screenshot files. Imports run no sources or actions.</text>
</svg>
