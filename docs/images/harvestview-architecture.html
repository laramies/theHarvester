<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarvestView local run architecture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #061115; }
    body { min-height: 100vh; display: grid; place-items: center; }
    svg { display: block; width: 1280px; height: 720px; }
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harvestview-architecture-title harvestview-architecture-desc">
  <title id="harvestview-architecture-title">HarvestView local run architecture</title>
  <desc id="harvestview-architecture-desc">HarvestView controls isolated finite runs through an authenticated local API and compares finalized hostname evidence without starting discovery or DNS activity.</desc>
  <defs>
    <style>
      .title { font: 700 30px Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #efeae2; }
      .subtitle { font: 450 16px Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #91a2a5; }
      .zone { font: 700 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .12em; fill: #91a2a5; }
      .tag { font: 700 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .08em; fill: #91a2a5; }
      .tag-accent { fill: #72dac9; }
      .node-title { font: 700 20px Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #efeae2; }
      .body { font: 450 15px Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #91a2a5; }
      .body-strong { font: 650 15px Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c6c0b6; }
      .technical { font: 600 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #91a2a5; }
      .technical-accent { font: 700 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #72dac9; }
      .edge-label { font: 700 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .08em; fill: #91a2a5; }
      .edge-label-accent { fill: #72dac9; }
    </style>
    <marker id="harvestview-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4d656a"/>
    </marker>
    <marker id="harvestview-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2bbdaa"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#061115"/>
  <text class="zone" x="48" y="56">HARVESTVIEW</text>
  <text class="title" x="48" y="92">Local runs and saved evidence in HarvestView</text>
  <text class="subtitle" x="48" y="120">The API queues finite runs. Hostname comparisons read saved results without contacting the target.</text>

  <rect x="48" y="144" width="1184" height="528" rx="12" fill="#0c191d" stroke="#2f4046" stroke-dasharray="8 8"/>
  <rect x="68" y="134" width="264" height="20" fill="#061115"/>
  <text class="zone" x="76" y="150">LOCAL MACHINE · 127.0.0.1:5000</text>

  <line x1="304" y1="244" x2="360" y2="244" stroke="#4d656a" stroke-width="1.5" marker-end="url(#harvestview-architecture-arrow)"/>
  <line x1="360" y1="284" x2="304" y2="284" stroke="#2bbdaa" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#harvestview-architecture-arrow-accent)"/>
  <line x1="580" y1="244" x2="636" y2="244" stroke="#4d656a" stroke-width="1.5" marker-end="url(#harvestview-architecture-arrow)"/>
  <line x1="868" y1="244" x2="924" y2="244" stroke="#4d656a" stroke-width="1.5" marker-end="url(#harvestview-architecture-arrow)"/>
  <line x1="416" y1="324" x2="416" y2="416" stroke="#2bbdaa" stroke-width="1.2" marker-end="url(#harvestview-architecture-arrow-accent)"/>
  <path d="M1042 324 V376 Q1042 384 1034 384 H552 Q544 384 544 392 V416" fill="none" stroke="#4d656a" stroke-width="1.5" marker-end="url(#harvestview-architecture-arrow)"/>
  <line x1="616" y1="504" x2="640" y2="504" stroke="#2bbdaa" stroke-width="1.5" marker-end="url(#harvestview-architecture-arrow-accent)"/>
  <path d="M470 592 V604 Q470 612 478 612 H1042 Q1050 612 1050 604 V592" fill="none" stroke="#4d656a" stroke-width="1.2" marker-end="url(#harvestview-architecture-arrow)"/>

  <rect x="306" y="220" width="52" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label" x="332" y="232" text-anchor="middle">SUBMIT</text>
  <rect x="312" y="260" width="40" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label edge-label-accent" x="332" y="272" text-anchor="middle">VIEW</text>
  <rect x="584" y="220" width="48" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label" x="608" y="232" text-anchor="middle">QUEUE</text>
  <rect x="872" y="220" width="48" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label" x="896" y="232" text-anchor="middle">CLAIM</text>
  <rect x="424" y="352" width="40" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label edge-label-accent" x="444" y="364" text-anchor="middle">READ</text>
  <rect x="736" y="360" width="48" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label" x="760" y="372" text-anchor="middle">WRITE</text>
  <rect x="730" y="588" width="56" height="16" rx="4" fill="#0c191d"/>
  <text class="edge-label" x="758" y="600" text-anchor="middle">EXPORT</text>

  <rect x="88" y="188" width="216" height="136" rx="10" fill="#142328" stroke="#2f4046"/>
  <line x1="88" y1="188" x2="88" y2="324" stroke="#4d656a" stroke-width="4"/>
  <text class="tag" x="112" y="216">BROWSER</text>
  <text class="node-title" x="112" y="252">Plan and inspect</text>
  <text class="body" x="112" y="284">target · sources · actions</text>
  <text class="body" x="112" y="308">history · changes</text>

  <rect x="360" y="188" width="220" height="136" rx="10" fill="#142328" stroke="#2f4046"/>
  <line x1="360" y1="188" x2="360" y2="324" stroke="#4d656a" stroke-width="4"/>
  <text class="tag" x="384" y="216">API GATE</text>
  <text class="node-title" x="384" y="252">Authenticated API</text>
  <text class="body" x="384" y="284">HttpOnly browser session</text>
  <text class="technical" x="384" y="308">X-API-KEY FOR CLIENTS</text>

  <rect x="636" y="172" width="232" height="168" rx="10" fill="#142328" stroke="#2f4046"/>
  <line x1="636" y1="172" x2="636" y2="340" stroke="#4d656a" stroke-width="4"/>
  <text class="tag" x="660" y="200">CONTROL</text>
  <text class="node-title" x="660" y="236">Durable run control</text>
  <text class="body" x="660" y="268">queue · cancel · deadlines</text>
  <text class="body" x="660" y="292">worker lease · recovery</text>
  <line x1="660" y1="304" x2="844" y2="304" stroke="#2f4046"/>
  <text class="technical" x="660" y="324">SCHEDULES → FINITE RUNS</text>

  <rect x="924" y="188" width="236" height="136" rx="10" fill="#142328" stroke="#2f4046"/>
  <line x1="924" y1="188" x2="924" y2="324" stroke="#4d656a" stroke-width="4"/>
  <text class="tag" x="948" y="216">WORKER</text>
  <text class="node-title" x="948" y="252">Isolated run worker</text>
  <text class="body" x="948" y="284">one finite run at a time</text>
  <text class="body" x="948" y="308">same core as the CLI</text>

  <rect x="344" y="416" width="272" height="176" rx="10" fill="#142328" stroke="#2f4046"/>
  <line x1="344" y1="416" x2="344" y2="592" stroke="#4d656a" stroke-width="4"/>
  <text class="tag" x="384" y="444">EVIDENCE</text>
  <text class="node-title" x="384" y="480">Persisted run evidence</text>
  <text class="body" x="384" y="512">results · provenance</text>
  <text class="body" x="384" y="540">outcomes · target scope</text>
  <text class="technical" x="384" y="568">FINALIZED RUNS</text>

  <rect x="640" y="416" width="288" height="176" rx="10" fill="#00312b" stroke="#2bbdaa" stroke-width="1.5"/>
  <line x1="640" y1="416" x2="640" y2="592" stroke="#2bbdaa" stroke-width="4"/>
  <text class="tag tag-accent" x="664" y="444">READ-ONLY COMPARISON</text>
  <text class="node-title" x="664" y="480">Hostname changes</text>
  <text class="body" x="664" y="512">same target · source list</text>
  <text class="technical-accent" x="664" y="528">NEWLY / NO LONGER REPORTED</text>
  <text class="technical-accent" x="664" y="548">STILL REPORTED · UNCERTAIN</text>
  <text class="technical-accent" x="664" y="568">NO DISCOVERY OR DNS</text>

  <rect x="952" y="416" width="208" height="176" rx="10" fill="#142328" stroke="#2f4046"/>
  <line x1="952" y1="416" x2="952" y2="592" stroke="#4d656a" stroke-width="4"/>
  <text class="tag" x="972" y="444">INTERCHANGE</text>
  <text class="node-title" x="972" y="480">Portable evidence</text>
  <text class="body" x="972" y="512">JSONL · one run</text>
  <text class="body" x="972" y="540">SQLite · completed set</text>
  <text class="technical" x="972" y="568">FILES STAY SEPARATE</text>

  <line x1="88" y1="632" x2="1192" y2="632" stroke="#2f4046"/>
  <text class="body-strong" x="88" y="656">Portable exports omit control state and screenshot files. Imports run no sources or actions.</text>
</svg>
</body>
</html>
